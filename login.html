<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

    background: #fff;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .topbar {
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #5f6368;
  }
  .topbar a { color: #5f6368; text-decoration: none; margin-left: 24px; }

    width: 100%;
    max-width: 428px;
    margin: auto;
    padding: 48px 40px 36px;
  }

    display: block;
    margin: 0 auto 28px;
    height: 110px;
    width: auto;

    font-weight: 400;
    color: #202124;
    text-align: center;
    margin-bottom: 8px;
  }
  .subtitle {
    text-align: center;
    color: #5f6368;
    font-size: 14px;
    margin-bottom: 28px;
  }
  .field { position: relative; margin-bottom: 12px; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #dadce0;
    border-radius: 4px;
    font-size: 16px;
    color: #202124;
    outline: none;
  }
  input:focus { border-color: #1a73e8; border-width: 2px; padding: 13px 15px; }
  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
  }
  .link { color: #1a73e8; font-size: 14px; text-decoration: none; }
  .btn {
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn:hover { background: #1765cc; }
  .footer {
    margin-top: auto;
    padding: 24px;
    text-align: center;
    font-size: 12px;
    color: #5f6368;
  }
  .footer a { color: #5f6368; text-decoration: none; margin: 0 8px; }
</style>
